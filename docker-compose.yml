name: ishchi

# Serverda ishlaydigan variant. Maktab loyihasi bilan aralashmasligi uchun:
#  - alohida compose loyihasi ("ishchi") -> alohida tarmoq va volume nomlari
#  - portlar faqat 127.0.0.1 da (tashqaridan ochiq emas, maktab portlari 8085/5434 bilan to'qnashmaydi)
#  - har bir servisga xotira chegarasi: biri "qochib" ketsa ham maktab loyihasiga ta'sir qilmaydi
services:
  db:
    image: postgres:16-alpine
    container_name: ishchi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ishchi}
      POSTGRES_USER: ${DB_USER:-ishchi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Tashkent
    volumes:
      - ishchi_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5439:5432"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ishchi} -d ${DB_NAME:-ishchi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ishchi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ishchi}
      DB_USER: ${DB_USER:-ishchi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Used to build the Telegram webhook and bot deep-link URLs, so it has to be the public
      # address this backend is reachable at. Left unset it falls back to the built-in default,
      # which silently points a different deployment's bot at the wrong host.
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/app/secrets/firebase-service-account.json}
      TZ: Asia/Tashkent
    volumes:
      - ishchi_uploads:/app/uploads
      # The whole directory, not the file: a file bind-mount makes Docker create a *directory* in
      # its place when the file is missing, so a fresh clone (secrets/ is gitignored) failed to
      # start. Mounting the directory means a missing credentials file just leaves push
      # notifications switched off, which the backend already handles.
      - ./backend/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  cloudflared-landing:
    image: cloudflare/cloudflared:latest
    container_name: ishchi-tunnel-landing
    restart: unless-stopped
    depends_on:
      - backend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_LANDING_TUNNEL_TOKEN:?CLOUDFLARE_LANDING_TUNNEL_TOKEN is required}
    mem_limit: 256m

volumes:
  ishchi_db_data:
  ishchi_uploads:
