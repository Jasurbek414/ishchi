server:
  port: 8080

spring:
  application:
    name: ishchi-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ishchi}
    username: ${DB_USER:ishchi}
    password: ${DB_PASSWORD:ishchi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Tashkent
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Without a cap the client picks the page size, and Spring's own default ceiling is 2000 —
        # enough to drain a whole table in one request.
        max-page-size: 50
        default-page-size: 20
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 60MB

app:
  base-url: ${APP_BASE_URL:https://api.uzbishchi.uz}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-env-file-min-32-chars-long}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  otp:
    ttl-minutes: 10
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin:
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# The API description lists every endpoint and field, so it is off unless a developer turns it on
# (API_DOCS_ENABLED=true) on their own machine.
springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # prometheus is included so request, error and connection-pool metrics can be scraped. It is
        # not in the public allow-list in SecurityConfig, so it needs an admin token from outside.
        include: health,info,prometheus
  metrics:
    tags:
      application: ishchi
  observations:
    key-values:
      application: ishchi

logging:
  level:
    uz.ishchi: INFO
