name: Deploy

# Ships a commit to the production server over SSH: tools/deploy-server.sh backs up the
# database, rebuilds the backend and, if Flutter is installed there, publishes a new APK.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST     the server's address
#   SERVER_USER     the SSH user
#   SERVER_SSH_KEY  a private key whose public half is in that user's ~/.ssh/authorized_keys
#
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys at once would race on the same containers and the same database.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the bundle below is self-contained.
          fetch-depth: 0

      - name: Check the secrets are set
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=
          [ -n "$SERVER_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$SERVER_USER" ] || missing="$missing SERVER_USER"
          [ -n "$SERVER_SSH_KEY" ] || missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing"
            exit 1
          fi

      # The commit travels as a git bundle, so the server needs no access to this private repo.
      - name: Bundle the commit
        run: git bundle create "$RUNNER_TEMP/ishchi.bundle" HEAD

      - name: Set up SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          target="$SERVER_USER@$SERVER_HOST"
          dest="/tmp/ishchi-deploy-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/deploy_key "$target" "mkdir -p '$dest'"
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/ishchi.bundle" tools/deploy-server.sh "$target:$dest/"
          ssh -i ~/.ssh/deploy_key "$target" \
            "bash '$dest/deploy-server.sh' '$dest/ishchi.bundle'; status=\$?; rm -rf '$dest'; exit \$status"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
