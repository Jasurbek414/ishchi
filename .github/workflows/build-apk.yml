name: Build APK and App Bundle

# Builds and signs both the APK and App Bundle (.aab) for Google Play Market
# using the official release keystore stored in repository secrets.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle_and_apk:
    name: Build App Bundle & APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p mobile/android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/keystore/ishchi-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keystore/ishchi-release.jks\n" "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > mobile/android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "::warning::No release keystore secret found, falling back to debug key."
          fi

      - name: Set up Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > mobile/android/app/google-services.json
            echo "google-services.json configured."
          fi

      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          # 1. Build App Bundle (.aab) for Google Play Console
          flutter build appbundle --release --no-tree-shake-icons --obfuscate --split-debug-info=build/symbols
          # 2. Build APK (.apk) for direct install / server distribution
          flutter build apk --release --no-tree-shake-icons --obfuscate --split-debug-info=build/symbols
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "AAB_NAME=ishchi-$version-release" >> "$GITHUB_ENV"
          echo "APK_NAME=ishchi-$version-release" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-${VERSION}-${{ github.run_number }}"
          cp mobile/build/app/outputs/bundle/release/app-release.aab "$AAB_NAME.aab"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME.apk"
          gh release create "$tag" "$AAB_NAME.aab" "$APK_NAME.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Release ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Production build from ${GITHUB_REF_NAME}. Signed with official release key."
          echo "aab_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$AAB_NAME.aab" >> "$GITHUB_STEP_SUMMARY"
          echo "apk_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$APK_NAME.apk" >> "$GITHUB_STEP_SUMMARY"
