name: Build APK

# A test APK of the app on every change under mobile/, or on demand from the Actions tab.
# Without the release keystore (which only the server holds, see deploy.yml) the build falls
# back to the debug key, so this APK installs fresh but cannot update an app signed with the
# release key — uninstall that first. It is for testing; the published APK comes from deploy.yml.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  # To attach the APK to a pre-release: a release asset downloads from a plain link (handy on a
  # phone), where a run artifact needs a GitHub login and comes zipped.
  contents: write

jobs:
  apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')
          echo "APK_NAME=ishchi-$version-test" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-apk-${{ github.run_number }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME.apk"
          gh release create "$tag" "$APK_NAME.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Test APK ${APK_NAME#ishchi-} (${GITHUB_SHA::7})" \
            --notes "Test build from ${GITHUB_REF_NAME}. Signed with the debug key and built without google-services.json: push notifications are off, and it cannot update an app signed with the release key — uninstall that first."
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$APK_NAME.apk" >> "$GITHUB_STEP_SUMMARY"
