name: Build APK

# Builds and signs the APK using the official release keystore stored in repository secrets.
# All builds share the identical signature so phones can update seamlessly.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p mobile/android/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/keystore/ishchi-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keystore/ishchi-release.jks\n" "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > mobile/android/key.properties
            echo "Release keystore configured successfully."
          else
            echo "::warning::No release keystore secret found, falling back to debug key."
          fi

      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          # Obfuscated so class and function names cannot be read back out of the APK; the
          # symbol map stays on the runner and is discarded with it.
          flutter build apk --release --no-tree-shake-icons --obfuscate --split-debug-info=build/symbols
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')
          echo "APK_NAME=ishchi-$version-release" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-apk-${{ github.run_number }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME.apk"
          gh release create "$tag" "$APK_NAME.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Release APK ${APK_NAME#ishchi-} (${GITHUB_SHA::7})" \
            --notes "Build from ${GITHUB_REF_NAME}. Signed with official release key."
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$APK_NAME.apk" >> "$GITHUB_STEP_SUMMARY"
