name: Build APK

# A test APK of the app on every change under mobile/, or on demand from the Actions tab.
# Without the release keystore (which only the server holds, see deploy.yml) the build falls
# back to the debug key, so this APK installs fresh but cannot update an app signed with the
# release key — uninstall that first. It is for testing; the published APK comes from deploy.yml.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.3
          channel: stable
          cache: true

      - name: Build
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
          version=$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')
          echo "APK_NAME=ishchi-$version-test" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
