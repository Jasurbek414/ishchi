# 384m of metaspace was not enough for AGP's lint analysis on top of the Kotlin
# compiler: the release APK build died with OutOfMemoryError: Metaspace right after
# the bundle succeeded. The build container has ~7GB free, so this is comfortable.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
